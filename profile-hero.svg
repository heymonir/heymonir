<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="title description">
  <title id="title">Moniruzzaman</title>
  <desc id="description">Full Stack Developer, WordPress Expert, and AI Engineer. Founder and CEO of Pixel Web Stack.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0F172A"/><stop offset="1" stop-color="#21154A"/>
    </linearGradient>
    <linearGradient id="accent"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7C3AED" stop-opacity=".30"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <clipPath id="bounds"><rect width="840" height="270" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="840" height="270" fill="url(#background)"/>
    <ellipse cx="755" cy="70" rx="320" ry="235" fill="url(#glow)"/>
    <g fill="none" stroke="#A5B4FC" opacity=".25">
      <rect x="685" y="43" width="92" height="92" rx="19" transform="rotate(24 731 89)"/>
      <rect x="719" y="79" width="92" height="92" rx="19" transform="rotate(24 765 125)"/>
      <rect x="753" y="115" width="92" height="92" rx="19" transform="rotate(24 799 161)"/>
    </g>
    <rect x="49" y="50" width="52" height="5" rx="2.5" fill="url(#accent)"/>
    <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
      <text x="48" y="130" fill="#FFFFFF" font-size="65" font-weight="750" letter-spacing="-2">Moniruzzaman</text>
      <text x="50" y="175" fill="#E2E8F0" font-size="24" font-weight="600">Full Stack Developer · WordPress Expert · AI Engineer</text>
      <text x="50" y="219" fill="#C4B5FD" font-size="22">Founder &amp; CEO, Pixel Web Stack</text>
    </g>
  </g>
</svg>
